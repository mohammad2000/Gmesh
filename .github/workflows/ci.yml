name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Generator versions are pinned to the ones that produced gen/: any
      # drift rewrites the version headers and fails the diff below.
      - name: Verify generated proto in sync
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler   # 3.21.12 on ubuntu-24.04
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          pip install grpcio-tools==1.80.0
          bash scripts/gen-proto.sh
          git diff --exit-code -- gen/ python-bridge/gmesh/

      - name: Build
        run: make build

      - name: Test
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: bin/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62

  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper
      - name: Build package
        run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          retention-days: 30
